name: Build and Validate Apps

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'installer/**'
      - 'catalog.json'
      - 'bridge/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'installer/**'
      - 'catalog.json'
      - 'bridge/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.catalog.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog.json
        id: catalog
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('.')
          errors = []

          try:
              cat = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'ERROR: catalog.json is not valid JSON: {exc}', file=sys.stderr)
              sys.exit(1)

          if cat.get('schemaVersion') != 1:
              errors.append(f"schemaVersion must be 1, got {cat.get('schemaVersion')!r}")

          schema = cat.get('$schema')
          if not isinstance(schema, str) or not schema.startswith('https://'):
              errors.append(f'$schema must be an https URL, got {schema!r}')

          hub = cat.get('hub')
          if not isinstance(hub, dict):
              errors.append(f'hub must be an object, got {type(hub).__name__}')
          else:
              for key in ('name', 'tagline', 'description', 'repo', 'appsPath', 'catalog'):
                  value = hub.get(key)
                  if not isinstance(value, str) or not value.strip():
                      errors.append(f'hub.{key} must be a non-empty string')
              if hub.get('catalog') != 'catalog.json':
                  errors.append(f"hub.catalog must be 'catalog.json', got {hub.get('catalog')!r}")

          apps = cat.get('apps')
          if not isinstance(apps, list) or not apps:
              errors.append('apps must be a non-empty array')
              apps = []

          required_archs = {'armv7', 'aarch64', 'x86_64'}
          seen_ids = set()
          seen_paths = set()
          semver = re.compile(r'^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$')
          app_id_re = re.compile(r'^app\.[A-Za-z0-9._-]+$')

          for index, app in enumerate(apps):
              label = app.get('id') if isinstance(app, dict) else f'apps[{index}]'
              if not isinstance(app, dict):
                  errors.append(f'{label}: app entry must be an object')
                  continue

              for key in ('id', 'name', 'summary', 'description', 'path', 'license', 'version', 'updated'):
                  value = app.get(key)
                  if not isinstance(value, str) or not value.strip():
                      errors.append(f'{label}: {key} must be a non-empty string')

              app_id = app.get('id', '')
              if app_id and not app_id_re.match(app_id):
                  errors.append(f'{label}: malformed app id {app_id!r}')
              if app_id in seen_ids:
                  errors.append(f'{label}: duplicate app id {app_id!r}')
              seen_ids.add(app_id)

              version = app.get('version', '')
              if version and not semver.match(version):
                  errors.append(f'{label}: version {version!r} is not semver')

              archs = app.get('architectures')
              if not isinstance(archs, list) or not required_archs.issubset(set(archs)):
                  errors.append(f'{label}: architectures must include {sorted(required_archs)}')

              install = app.get('install')
              if not isinstance(install, dict):
                  errors.append(f'{label}: install must be an object')
              else:
                  if install.get('kind') != 'vpkg-release':
                      errors.append(f"{label}: install.kind must be 'vpkg-release'")
                  release = install.get('release')
                  if not isinstance(release, str) or not release.startswith('https://'):
                      errors.append(f'{label}: install.release must be an https URL')
                  note = install.get('note')
                  if not isinstance(note, str) or not note.strip():
                      errors.append(f'{label}: install.note must be a non-empty string')
                  elif re.search(r'(?<!no )prebuilt \.vpkg is published', note.lower()):
                      errors.append(f'{label}: install.note claims a prebuilt .vpkg is published')

              screenshots = app.get('screenshots', [])
              if screenshots is None:
                  screenshots = []
              if not isinstance(screenshots, list):
                  errors.append(f'{label}: screenshots must be an array')
              else:
                  for shot in screenshots:
                      if not isinstance(shot, str) or not shot.strip():
                          errors.append(f'{label}: screenshot must be a non-empty string')
                      elif shot.startswith('https://'):
                          if not urlparse(shot).netloc:
                              errors.append(f'{label}: malformed screenshot URL {shot!r}')
                      else:
                          shot_path = Path(shot)
                          if shot_path.is_absolute() or '..' in shot_path.parts:
                              errors.append(f'{label}: unsafe screenshot path {shot!r}')
                          elif not (root / shot_path).is_file():
                              errors.append(f'{label}: missing screenshot file {shot!r}')

              path_text = app.get('path', '')
              if not path_text:
                  continue
              app_path = Path(path_text)
              if app_path.is_absolute() or '..' in app_path.parts:
                  errors.append(f'{label}: unsafe app path {path_text!r}')
                  continue
              if path_text in seen_paths:
                  errors.append(f'{label}: duplicate app path {path_text!r}')
              seen_paths.add(path_text)

              if not app_path.is_dir():
                  errors.append(f'{label}: missing app directory {path_text!r}')
                  continue
              for required in ('manifest.toml', 'package.json', 'app.json', 'index.js', 'src/App.tsx'):
                  if not (app_path / required).is_file():
                      errors.append(f'{label}: missing {app_path / required}')

              try:
                  pkg = json.loads((app_path / 'package.json').read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{label}: package.json is invalid: {exc}')
                  continue
              if pkg.get('version') != version:
                  errors.append(f'{label}: catalog version {version!r} != package.json version {pkg.get("version")!r}')
              scripts = pkg.get('scripts')
              if not isinstance(scripts, dict) or not scripts.get('build:release'):
                  errors.append(f'{label}: package.json has no build:release script')

          if errors:
              for error in errors:
                  print(f'ERROR: {error}', file=sys.stderr)
              sys.exit(1)

          matrix = [{'id': app['id'], 'path': app['path']} for app in apps]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'apps={json.dumps(matrix)}\n')
          print(f'Catalog valid: {len(apps)} apps, {len(seen_ids)} unique ids')
          PY

  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch:
          - armv7
          - aarch64
          - x86_64
        app: ${{ fromJson(needs.validate.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vega SDK
        env:
          NONINTERACTIVE: 'true'
          SKIP_VVD_INSTALL: 'true'
          VEGA_SDK_VERSION: '2.0.13986'
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Install app dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.app.id }} for ${{ matrix.arch }}
        working-directory: ${{ matrix.app.path }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if node -e 'const s=require("./package.json").scripts||{}; process.exit(s["build:release:vega"] ? 0 : 1)'; then
            if node -e 'const s=require("./package.json").scripts||{}; process.exit(s["build:injection"] ? 0 : 1)'; then
              npm run build:injection
            fi
            npm run build:release:vega -- --target "$TARGET_ARCH"
          else
            npm run build:release -- --target "$TARGET_ARCH"
          fi

      - name: Upload ${{ matrix.app.id }} ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app.id }}-${{ matrix.arch }}
          path: ${{ matrix.app.path }}/build/${{ matrix.arch }}-release/*.vpkg
          if-no-files-found: error
