schema-version = 1

[package]
title = "Cinevega"
version = "1.0.2"
id = "app.cinevega"
icon = "@image/cinevega.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.webview_4@IWebview_4"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[components]
[[components.interactive]]
id = "app.cinevega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# TMDB metadata and VidSrc playback both need network access.
[[wants.service]]
id = "com.amazon.network.service"

[[wants.service]]
id = "com.amazon.webview.renderer_service"

# D-pad and remote keys must reach the app
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.media.server"
