schema-version = 1

[package]
title = "TV Timer"
version = "1.0.1"
id = "app.tvtimer"
icon = "@image/tvtimer.png"

# Vega OS 1.2 is the only version the current SDK mints.
[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# Pure React Native UI — no WebView, no network, works fully offline.
[[components.interactive]]
id = "app.tvtimer.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# D-pad and remote keys must reach the app
[[wants.service]]
id = "com.amazon.inputmethod.service"
