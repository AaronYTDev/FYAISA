<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Mario Bros</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: monospace;
    font-size: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="screen" width="256" height="240"></canvas>
<div id="status">Loading…</div>
<script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>
<script>
(function() {
  var status = document.getElementById('status');
  var canvas = document.getElementById('screen');
  var ctx = canvas.getContext('2d');

  // ROM download URL (external host)
  var ROM_URL = 'https://archive.org/download/SuperMarioBrosUSA/Super%20Mario%20Bros.%20%28USA%29.nes';

  // NES button state
  var buttons = {
    up: false, down: false, left: false, right: false,
    a: false, b: false, start: false, select: false
  };

  // Expose button control to React Native
  window.__nesButton = function(button, pressed) {
    if (buttons.hasOwnProperty(button)) {
      buttons[button] = pressed;
    }
  };

  // jsnes setup
  var nes = new jsnes.NES({
    onFrame: function(frameBuffer) {
      var imageData = ctx.createImageData(256, 240);
      for (var i = 0; i < frameBuffer.length; i++) {
        var pixel = frameBuffer[i];
        imageData.data[i * 4] = pixel & 0xff;         // R
        imageData.data[i * 4 + 1] = (pixel >> 8) & 0xff;  // G
        imageData.data[i * 4 + 2] = (pixel >> 16) & 0xff; // B
        imageData.data[i * 4 + 3] = 0xff;             // A
      }
      ctx.putImageData(imageData, 0, 0);
    },
    onAudioSample: function(left, right) {
      // Audio not implemented
    }
  });

  // Map buttons to jsnes controller
  function updateButtons() {
    nes.buttonDown(1, jsnes.Controller.BUTTON_UP, buttons.up);
    nes.buttonDown(1, jsnes.Controller.BUTTON_DOWN, buttons.down);
    nes.buttonDown(1, jsnes.Controller.BUTTON_LEFT, buttons.left);
    nes.buttonDown(1, jsnes.Controller.BUTTON_RIGHT, buttons.right);
    nes.buttonDown(1, jsnes.Controller.BUTTON_A, buttons.a);
    nes.buttonDown(1, jsnes.Controller.BUTTON_B, buttons.b);
    nes.buttonDown(1, jsnes.Controller.BUTTON_START, buttons.start);
    nes.buttonDown(1, jsnes.Controller.BUTTON_SELECT, buttons.select);
  }

  // Download and load ROM
  function loadRom() {
    status.textContent = 'Downloading ROM…';
    fetch(ROM_URL)
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(function(data) {
        status.textContent = 'Starting…';
        var rom = new Uint8Array(data);
        nes.loadROM(rom);
        status.style.display = 'none';
        // Start the emulator loop
        function loop() {
          nes.frame();
          updateButtons();
          requestAnimationFrame(loop);
        }
        loop();
      })
      .catch(function(e) {
        status.textContent = 'ROM download failed: ' + e.message;
        console.error('ROM download failed:', e);
      });
  }

  // Start
  loadRom();
})();
</script>
</body>
</html>
