schema-version = 1

[package]
title = "DOOM"
version = "1.0.0"
id = "app.doom"
icon = "@image/doom.png"

# Vega OS 1.2 is the only version the current SDK mints. For firmware still on
# 1.1 use SDK 0.23.9221 and set min/target to "1.1" with IVega_1_1.
[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# The game renders to a canvas inside a Vega WebView, same as VegaTube.
[[needs.module]]
id = "/com.amazon.kepler.webview_4@IWebview_4"




[components]
[[components.interactive]]
id = "app.doom.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# Web renderer service for rendering web content
[[wants.service]]
id = "com.amazon.webview.renderer_service"

# D-pad and remote keys must reach the page
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Audio/media services. Web Audio inside the WebView is rendered by the
# platform's audio backend, not internally by Chromium. Without these
# declarations app.doom cannot bind com.amazon.audio.control: the audio
# manager and audio focus fail to initialize, and Chromium defers the audio
# output ("Start of output audio is deferred"), so the game is silent even
# though SDL_mixer opened its device successfully.
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"
